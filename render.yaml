services:
  - type: web
    name: link-changer-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: NETLIFY_TOKEN
        sync: false
      - key: NETLIFY_SITE_ID
        sync: false
