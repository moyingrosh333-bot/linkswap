<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Continue to our website</title>
  <!-- The bot puts the current link here. Keep this tag. -->
  <meta name="link-target" content="{{LINK}}">
  <meta name="robots" content="noindex">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0d0a;
      --card-top: #1a2418;
      --card-bottom: #0f140f;
      --border: rgba(255, 255, 255, 0.10);
      --green: #a8e06c;
      --green-2: #8fd35a;
      --green-light: #c6ef8f;
      --text: #f4f6f2;
      --muted: #9aa396;
      --faint: #7d857a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 80% at 50% 0%, #121a11 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, var(--card-top) 0%, var(--card-bottom) 55%);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 24px 26px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    }
    .icon {
      width: 84px; height: 84px;
      margin: 0 auto 26px;
      border-radius: 22px;
      display: grid; place-items: center;
      background: linear-gradient(160deg, #3b5233 0%, #22301f 100%);
      border: 1px solid rgba(168, 224, 108, 0.22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .icon svg { width: 40px; height: 40px; }
    .pill {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--green-light);
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(168, 224, 108, 0.8);
    }
    h1 {
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    h1 span { color: var(--green); }
    .sub {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
      max-width: 330px;
      margin: 0 auto 26px;
    }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%;
      padding: 19px 20px;
      border-radius: 20px;
      background: linear-gradient(100deg, var(--green-light) 0%, var(--green-2) 100%);
      color: #0c120b;
      font-size: 17px; font-weight: 800;
      letter-spacing: -0.01em;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(143, 211, 90, 0.22);
      transition: transform 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.98); filter: brightness(0.95); }
    .btn svg { width: 18px; height: 18px; }
    .btn.disabled { opacity: 0.45; pointer-events: none; }
    .note {
      color: var(--faint);
      font-size: 13px;
      margin-top: 14px;
    }
    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 24px 0 18px;
    }
    .ticks {
      display: flex; justify-content: center; flex-wrap: wrap;
      gap: 8px 16px;
      color: var(--muted);
      font-size: 13px;
    }
    .ticks span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .ticks svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a8e06c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
      </svg>
    </div>

    <div class="pill"><span class="dot"></span>Our Website</div>

    <h1>Shop or <span>Learn More</span></h1>

    <p class="sub">You're one step away. Open our website in your browser to shop or learn more.</p>

    <a id="go" class="btn" href="{{LINK}}" target="_blank" rel="noopener">
      Continue to Website
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M7 17L17 7"/><path d="M8 7h9v9"/>
      </svg>
    </a>

    <p class="note">Opens our website in your external browser.</p>

    <hr>

    <div class="ticks">
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#a8e06c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Browse the website
      </span>
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#a8e06c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        Continue securely
      </span>
    </div>
  </main>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var meta = document.querySelector('meta[name="link-target"]');
      var url = meta ? meta.content : "";
      var btn = document.getElementById("go");

      if (!/^https?:\/\//i.test(url)) {
        btn.classList.add("disabled");
        return;
      }

      if (tg) {
        try {
          tg.ready();
          tg.expand();
          tg.setHeaderColor && tg.setHeaderColor("#0a0d0a");
          tg.setBackgroundColor && tg.setBackgroundColor("#0a0d0a");
        } catch (e) {}
      }

      btn.addEventListener("click", function (e) {
        // Inside Telegram: open in the external browser.
        if (tg && tg.initData) {
          e.preventDefault();
          try { tg.HapticFeedback && tg.HapticFeedback.impactOccurred("medium"); } catch (e2) {}
          tg.openLink(url);
        }
        // Outside Telegram: the normal link opens it.
      });
    })();
  </script>
</body>
</html>
